services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-haunted_halls}
      POSTGRES_USER: ${POSTGRES_USER:-haunted_halls}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haunted_halls_local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-haunted_halls}"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  migrate:
    build:
      context: ../haunted-halls-engine
      dockerfile: Dockerfile
      target: runner
    image: haunted-halls-engine:local
    env_file:
      - path: ../haunted-halls-engine/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-haunted_halls}:${POSTGRES_PASSWORD:-haunted_halls_local}@postgres:5432/${POSTGRES_DB:-haunted_halls}
      INTERNAL_ENGINE_SERVICE_TOKEN: ${INTERNAL_ENGINE_SERVICE_TOKEN:-local-compose-token-change-me-00000000000000000000000000000000000000}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "alembic", "upgrade", "head"]

  engine:
    build:
      context: ../haunted-halls-engine
      dockerfile: Dockerfile
      target: runner
    image: haunted-halls-engine:local
    # Engine-local runtime configuration (OpenAI settings, model settings, etc.)
    # is read from the host at runtime and is never baked into the image.
    env_file:
      - path: ../haunted-halls-engine/.env
        required: false
    # Values below are Compose-specific and intentionally override the engine .env.
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-haunted_halls}:${POSTGRES_PASSWORD:-haunted_halls_local}@postgres:5432/${POSTGRES_DB:-haunted_halls}
      INTERNAL_ENGINE_SERVICE_TOKEN: ${INTERNAL_ENGINE_SERVICE_TOKEN:-local-compose-token-change-me-00000000000000000000000000000000000000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: haunted-halls-frontend:local
    depends_on:
      engine:
        condition: service_healthy
    environment:
      ENGINE_BASE_URL: http://engine:8000
      INTERNAL_ENGINE_SERVICE_TOKEN: ${INTERNAL_ENGINE_SERVICE_TOKEN:-local-compose-token-change-me-00000000000000000000000000000000000000}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-local-compose-nextauth-secret-change-me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-local-compose-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-local-compose-google-client-secret}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

volumes:
  postgres-data: