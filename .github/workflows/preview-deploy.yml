name: Preview Prerequisite Acceptance

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Frontend CI"]
    types: [completed]

permissions:
  contents: read

env:
  GCP_PROJECT: hh-preview-458395246135
  WIF_PROVIDER: projects/1001419903197/locations/global/workloadIdentityPools/hh-preview-github/providers/github-preview
  DEPLOY_SERVICE_ACCOUNT: hh-preview-deployer@hh-preview-458395246135.iam.gserviceaccount.com

jobs:
  acceptance:
    name: Manual trusted prerequisite checks
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'jtesolin/haunted-halls'
    runs-on: ubuntu-latest
    concurrency:
      group: preview-prerequisite-acceptance
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    steps:
      - name: Require exact trusted workflow identity
        run: |
          set -euo pipefail
          test "$GITHUB_WORKFLOW_REF" = "jtesolin/haunted-halls/.github/workflows/preview-deploy.yml@refs/heads/main"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"

      - name: Check out trusted main revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checked-out source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Authenticate only as preview deployer
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Run bounded acceptance harness
        run: python3 tools/preview-acceptance/acceptance.py run

      - name: Clean up owned canaries and summarize
        if: ${{ always() && steps.auth.outcome == 'success' }}
        run: python3 tools/preview-acceptance/acceptance.py cleanup

      - name: Report authentication failure
        if: ${{ always() && steps.auth.outcome != 'success' }}
        run: |
          cat <<'SUMMARY' | tee -a "$GITHUB_STEP_SUMMARY"
          ## Preview prerequisite acceptance
          Principal: UNVERIFIED. Preview project: hh-preview-458395246135 / 1001419903197.
          FAIL: trusted preview authentication was not established; acceptance did not run.
          IAP, Secret Manager, quota, staging metadata, and source registry checks: NOT RUN. No canaries created.
          SUMMARY

  deploy:
    name: Create or update the frontend PR preview
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.repository == 'jtesolin/haunted-halls'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: frontend-preview-pr-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
      id-token: write
      pull-requests: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GCP_PROJECT: hh-preview-458395246135
      WIF_PROVIDER: projects/1001419903197/locations/global/workloadIdentityPools/hh-preview-github/providers/github-preview
      DEPLOY_SERVICE_ACCOUNT: hh-preview-deployer@hh-preview-458395246135.iam.gserviceaccount.com
      PREVIEW_IAP_TESTERS: ${{ vars.PREVIEW_IAP_TESTERS }}
    steps:
      - name: Require a fresh trusted default-branch workflow context
        run: |
          set -euo pipefail
          test "$GITHUB_WORKFLOW_REF" = "jtesolin/haunted-halls/.github/workflows/preview-deploy.yml@refs/heads/main"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_run"
          test "$GITHUB_REPOSITORY" = "jtesolin/haunted-halls"

      - name: Check out only the trusted default-branch revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify trusted source and set up deployment tools
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Install pinned checksum-verified gcrane
        env:
          GCRANE_VERSION: v0.22.1
          GCRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/go-containerregistry_Linux_x86_64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/google/go-containerregistry/releases/download/${GCRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${GCRANE_SHA256}  ${archive}" | sha256sum --check --strict -
          install_dir="$RUNNER_TEMP/gcrane-bin"
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" gcrane
          rm -f "$archive"
          test "$("$install_dir/gcrane" version)" = "${GCRANE_VERSION#v}"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Validate workflow/artifact provenance before cloud authentication
        id: provenance
        run: >-
          python tools/preview-deploy/lifecycle.py prepare
          --event "$GITHUB_EVENT_PATH"
          --output-directory "$RUNNER_TEMP"
          --github-output "$GITHUB_OUTPUT"

      - name: Authenticate directly with WIF for the Terraform backend
        id: backend-auth
        if: steps.provenance.outputs.deploy == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          create_credentials_file: true
          export_environment_variables: false

      - name: Authenticate as the preview deployer for gcloud and the provider
        id: deployer-auth
        if: steps.provenance.outputs.deploy == 'true'
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          export_environment_variables: true

      - name: Create or update the isolated PR preview
        if: steps.provenance.outputs.deploy == 'true'
        env:
          CLOUDSDK_CORE_PROJECT: ${{ env.GCP_PROJECT }}
          GOOGLE_BACKEND_CREDENTIALS: ${{ steps.backend-auth.outputs.credentials_file_path }}
        run: >-
          python tools/preview-deploy/lifecycle.py deploy
          --context "$RUNNER_TEMP/preview-context.json"
