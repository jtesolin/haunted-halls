name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Frontend / Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  typecheck:
    name: Frontend / Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

  test:
    name: Frontend / Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    name: Frontend / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NODE_ENV: production
      NEXTAUTH_SECRET: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      NEXTAUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      ENGINE_BASE_URL: http://localhost:8000
      INTERNAL_ENGINE_SERVICE_TOKEN: test-internal-engine-service-token-0000000000000000000000000000000000
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build application
        run: npm run build

  terraform:
    name: Frontend / Terraform Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - name: Terraform format check
        run: |
          set -euo pipefail
          for root in \
            infra/terraform/bootstrap \
            infra/terraform \
            infra/terraform/preview-foundation/backend-bootstrap \
            infra/terraform/preview-foundation \
            infra/terraform/preview-pr
          do
            terraform -chdir="$root" fmt -check -recursive
          done

      - name: Terraform backend-disabled init and validate
        run: |
          set -euo pipefail
          for root in \
            infra/terraform/bootstrap \
            infra/terraform \
            infra/terraform/preview-foundation/backend-bootstrap \
            infra/terraform/preview-foundation \
            infra/terraform/preview-pr
          do
            terraform -chdir="$root" init -backend=false
            terraform -chdir="$root" validate
          done

      - name: Set up Python for provider-free DB provisioner tests
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run provider-free preview DB provisioner tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s infra/terraform/preview-foundation/db-provisioner -p 'test_*.py'

      - name: Run offline per-PR ownership and backend identity tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s infra/terraform/preview-pr -p 'test_*.py'

      - name: Run offline preview prerequisite IAM contract tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s infra/terraform/preview-foundation -p 'test_iam_*.py'

      - name: Run offline trusted secret-preparer contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tools/preview-secret-preparer -p 'test_*.py'

      - name: Run offline manual preview acceptance contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tools/preview-acceptance -p 'test_*.py'

      - name: Run mocked per-PR Terraform plans
        run: terraform -chdir=infra/terraform/preview-pr test

  docker-build:
    name: Frontend / Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build --target runner --tag haunted-halls:ci .

  e2e:
    name: Frontend / E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: haunted-halls-e2e
      POSTGRES_PASSWORD: e2e-ci-only-postgres-password
      INTERNAL_ENGINE_SERVICE_TOKEN: e2e-ci-only-internal-engine-token-000000000000000000000000000000
    steps:
      - name: Check out frontend repository
        uses: actions/checkout@v7
        with:
          path: haunted-halls

      - name: Check out haunted-halls-engine (main)
        uses: actions/checkout@v7
        with:
          repository: jtesolin/haunted-halls-engine
          ref: main
          path: haunted-halls-engine

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: haunted-halls/package-lock.json

      - name: Install dependencies
        working-directory: haunted-halls
        run: npm ci

      - name: Install Playwright browsers
        working-directory: haunted-halls
        run: npx playwright install --with-deps chromium

      - name: Start E2E Compose stack
        working-directory: haunted-halls
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build

      - name: Wait for frontend/engine health
        working-directory: haunted-halls
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then
              echo "Frontend is healthy."
              exit 0
            fi
            echo "Waiting for frontend to become healthy... ($i/60)"
            sleep 5
          done
          echo "Frontend did not become healthy in time." >&2
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml ps
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs
          exit 1

      - name: Run Playwright suite
        working-directory: haunted-halls
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npm run test:e2e

      - name: Save Compose logs on failure
        if: failure()
        working-directory: haunted-halls
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color > compose-logs.txt

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: haunted-halls/playwright-report/
          retention-days: 7

      - name: Upload Compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: haunted-halls/compose-logs.txt
          retention-days: 7

      - name: Tear down E2E Compose stack
        if: always()
        working-directory: haunted-halls
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
