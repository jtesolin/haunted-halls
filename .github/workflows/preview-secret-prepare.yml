name: Trusted Preview Secret Preparation

run-name: Preview secret preparation ${{ inputs.operation }} PR-${{ inputs.pull_request_number }}-${{ inputs.pr_incarnation }}-gen-${{ inputs.generation }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare one generation or inspect it without reading payloads
        required: true
        default: prepare
        type: choice
        options:
          - prepare
          - reconcile
      pull_request_number:
        description: Open non-draft frontend PR number (both operations)
        required: true
        type: string
      pr_incarnation:
        description: Trusted 32-character lowercase-hex ID for this preview lifetime
        required: true
        type: string
      generation:
        description: Next positive secret generation number for this incarnation
        required: true
        type: string
      expected_head_sha:
        description: Exact PR head SHA being deployed
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  pull-requests: read

concurrency:
  group: preview-secret-preparation-${{ inputs.pull_request_number }}
  cancel-in-progress: false

env:
  GCP_PROJECT: hh-preview-458395246135
  WIF_PROVIDER: projects/1001419903197/locations/global/workloadIdentityPools/hh-preview-github/providers/github-preview
  SECRET_PREPARER_SERVICE_ACCOUNT: hh-preview-secret-preparer@hh-preview-458395246135.iam.gserviceaccount.com

jobs:
  prepare:
    name: Prepare one trusted per-PR secret generation
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'jtesolin/haunted-halls'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require exact trusted workflow and open non-draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_WORKFLOW_REF" = "jtesolin/haunted-halls/.github/workflows/preview-secret-prepare.yml@refs/heads/main"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          python3 -c 'import re,sys; sys.exit(0 if re.fullmatch(r"[1-9][0-9]{0,8}", sys.argv[1]) else 1)' "$PR_NUMBER"
          python3 -c 'import re,sys; sys.exit(0 if re.fullmatch(r"[0-9a-f]{40}", sys.argv[1]) else 1)' "$EXPECTED_HEAD_SHA"
          trap 'rm -f "$RUNNER_TEMP/pr-initial.json" "$RUNNER_TEMP/validate_pr.py"' EXIT
          gh api "repos/jtesolin/haunted-halls/contents/tools/preview-secret-preparer/validate_pr.py?ref=$GITHUB_SHA" --jq .content \
            | python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))' \
            > "$RUNNER_TEMP/validate_pr.py"
          gh api "repos/jtesolin/haunted-halls/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr-initial.json"
          python3 "$RUNNER_TEMP/validate_pr.py" "$PR_NUMBER" "$RUNNER_TEMP/pr-initial.json" "$EXPECTED_HEAD_SHA"

      - name: Check out trusted main revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checked-out source and identity inputs
        env:
          PR_INCARNATION: ${{ inputs.pr_incarnation }}
          SECRET_GENERATION: ${{ inputs.generation }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - "$PR_INCARNATION" "$SECRET_GENERATION" <<'PY'
          import re
          import sys
          sys.exit(0 if re.fullmatch(r"[0-9a-f]{32}", sys.argv[1]) and
                   re.fullmatch(r"[1-9][0-9]{0,8}", sys.argv[2]) else 1)
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install hash-locked Google SDK runtime
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --requirement tools/preview-secret-preparer/requirements.lock

      - name: Revalidate PR immediately before authentication
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/pr-before-auth.json"' EXIT
          gh api "repos/jtesolin/haunted-halls/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr-before-auth.json"
          python tools/preview-secret-preparer/validate_pr.py "$PR_NUMBER" "$RUNNER_TEMP/pr-before-auth.json" "$EXPECTED_HEAD_SHA"

      - name: Authenticate only as the dedicated secret preparer
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SECRET_PREPARER_SERVICE_ACCOUNT }}

      - name: Prepare one generation
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          GOOGLE_CLOUD_PROJECT: ${{ env.GCP_PROJECT }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          PR_INCARNATION: ${{ inputs.pr_incarnation }}
          SECRET_GENERATION: ${{ inputs.generation }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/pr-before-prepare.json"' EXIT
          gh api "repos/jtesolin/haunted-halls/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr-before-prepare.json"
          python tools/preview-secret-preparer/validate_pr.py "$PR_NUMBER" "$RUNNER_TEMP/pr-before-prepare.json" "$EXPECTED_HEAD_SHA"
          rm "$RUNNER_TEMP/pr-before-prepare.json"
          python tools/preview-secret-preparer/prepare.py "$OPERATION" \
            --repository-key web \
            --pull-request-number "$PR_NUMBER" \
            --pr-incarnation "$PR_INCARNATION" \
            --generation "$SECRET_GENERATION" > "$RUNNER_TEMP/preparation.json"
          python3 - "$RUNNER_TEMP/preparation.json" "$RUNNER_TEMP/secret-version-metadata.json" \
            "$PR_NUMBER" "$PR_INCARNATION" "$SECRET_GENERATION" <<'PY'
          import json
          import re
          import sys
          source, destination, number, incarnation, generation = sys.argv[1:]
          with open(source, encoding="utf-8") as stream:
              result = json.load(stream)
          roles = {"nextauth", "internal_token", "database_url"}
          versions = result.get("secret_versions")
          state = result.get("state")
          if (state not in {"complete", "absent", "reserved", "writing", "reconciliation-required"}
                  or result.get("pull_request_number") != number
                  or result.get("pr_incarnation") != incarnation
                  or result.get("generation") != int(generation)
                  or not isinstance(versions, dict)
                  or not set(versions) <= roles
                  or (state == "complete" and set(versions) != roles)
                  or (state == "absent" and versions)
                  or any(not isinstance(value, str)
                         or not re.fullmatch(r"[1-9][0-9]*", value)
                         for value in versions.values())):
              raise SystemExit("Secret workflow returned incomplete or unsafe version metadata.")
          safe = {
              "pull_request_number": number,
              "pr_incarnation": incarnation,
              "generation": generation,
              "state": state,
              "secret_versions": versions,
          }
          with open(destination, "w", encoding="utf-8") as stream:
              json.dump(safe, stream, sort_keys=True, separators=(",", ":"))
          PY
          rm "$RUNNER_TEMP/preparation.json"
          echo "Secret payloads were not emitted. Numeric version metadata was written to a short-lived workflow artifact." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Publish non-sensitive numeric version metadata
        uses: actions/upload-artifact@v4
        with:
          name: preview-secret-version-metadata
          path: ${{ runner.temp }}/secret-version-metadata.json
          if-no-files-found: error
          retention-days: 1
